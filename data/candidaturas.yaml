# Registro de CANDIDATURAS (partido, coalición o agrupación de electores): la unidad que se
# compara (constitución I.6, spec 001). Editable sin tocar código.
#
# fase_inclusion:
#   provisional  → hasta que el BOE publique las candidaturas presentadas (~28 oct):
#                  candidaturas con representación en las Cortes (XV legislatura).
#   presentadas  → todas las candidaturas al Congreso publicadas en el BOE.
#   proclamadas  → todas las proclamadas (BOE ~3 nov).
#
# Campos:
#   tipo: partido | coalicion | agrupacion-electores
#   miembros: partidos que la integran (coaliciones)
#   color: SOLO acento identificador (constitución I.5). Provisionales: verificar en F2.
#   vigilar: URLs donde la candidatura suele publicar su programa (vigilancia, HU-1.10)
#   siglas_boe: expresiones regulares de las siglas con que concurre en el BOE (p. ej. el
#        PSOE como PSC en Cataluña). Gana la primera candidatura del registro que encaje.
#   convocatorias.generales-2023.programa_propio: false si concurrió dentro de otra
#        candidatura (dentro_de) → NO hay fallback a 2023 (spec 001).
#   convocatorias.generales-2026.estado: provisional | presentada | proclamada | no-proclamada
#   convocatorias.generales-2026.circunscripciones: lista de provincias (desde el BOE) o [todas]
#   incluir (solo fase provisional): siempre | si-concurre-por-separado
version: 2
fase_inclusion: provisional
candidaturas:
  - id: pp
    nombre: Partido Popular
    corto: PP
    tipo: partido
    ambito: estatal
    color: "#1D84CE"
    web: https://www.pp.es/
    vigilar: []
    siglas_boe: ['PP']
    incluir: siempre
    convocatorias:
      generales-2023: { programa_propio: true }
      generales-2026: { estado: provisional, circunscripciones: [] }

