# Registro de partidos. Criterio de inclusión (constitución I.6): representación en las Cortes
# Generales en la XV legislatura, más Sumar. Añadir/quitar un partido no requiere tocar código.
#
# color: SOLO acento identificador (constitución I.5). Valores provisionales: verificar contra
#        el manual de marca de cada partido en la fase F2.
# convocatorias.<id>.candidatura: con qué candidatura concurrió/concurre.
# convocatorias.<id>.fallback: false si en esa convocatoria concurrió dentro de otra candidatura
#        (no se le asigna el programa ajeno como propio; spec 001 «Regla de fallback»).
# incluir: siempre | si-programa-propio
version: 1
partidos:
  - id: pp
    nombre: Partido Popular
    corto: PP
    ambito: estatal
    color: "#1D84CE"
    web: https://www.pp.es/
    incluir: siempre
    convocatorias:
      generales-2023: { candidatura: PP }
      generales-2026: { candidatura: pendiente }

