[project]
name = "votoclaro"
version = "0.1.0"
description = "Pipeline de ingesta, análisis y verificación de programas electorales para VotoClaro"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pymupdf>=1.26",
  "openai>=1.60",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# Archivo de programas publicados como página web (HTML → PDF). `uv run playwright install chromium`
html = ["playwright>=1.45"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
vc = "votoclaro.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/votoclaro"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM905: las listas de palabras se leen mejor como cadena con .split()
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: pruebas lentas o que llaman a servicios externos (no se ejecutan en el hook Stop)"]
